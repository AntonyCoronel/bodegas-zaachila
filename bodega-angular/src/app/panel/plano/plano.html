<div class="lienzo">
  <svg [attr.viewBox]="viewBox()" role="group" aria-label="Plano de las bodegas a escala" class="plano"
       [class.cliente]="modo() === 'cliente'" [class.vertical]="vertical()">
    <defs>
      <pattern id="rayado" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="3" height="3" fill="#f3eee8" />
        <line x1="0" y1="0" x2="0" y2="3" stroke="#e1d7cb" stroke-width="1.1" />
      </pattern>
    </defs>

    <!-- Pasillo de carga -->
    @let p = pasillo();
    <rect class="pasillo" [attr.x]="p.x" [attr.y]="p.y" [attr.width]="p.w" [attr.height]="p.h" />
    @if (vertical()) {
      <line class="eje" [attr.x1]="p.x + p.w / 2" [attr.x2]="p.x + p.w / 2" [attr.y1]="p.y + 4" [attr.y2]="p.y + p.h - 4" />
      <g [attr.transform]="'translate(' + (p.x + p.w / 2) + ' ' + (p.y + p.h / 2) + ') rotate(-90)'">
        <text class="texto-pasillo" x="0" y="-2.6" text-anchor="middle">PASILLO DE CARGA</text>
        <text class="texto-pasillo sub" x="0" y="5.4" text-anchor="middle">acceso 24/7 con código</text>
      </g>
      <g class="entrada">
        <path [attr.d]="'M ' + (p.x + 9) + ' 1.5 V ' + (p.y + 4) + ' m -3.5 -4 l 3.5 4 l 3.5 -4'" />
        <text [attr.x]="p.x + 15" y="7">Entrada</text>
      </g>
    } @else {
      <line class="eje" [attr.x1]="p.x + 4" [attr.x2]="p.x + p.w - 4" [attr.y1]="p.y + p.h / 2" [attr.y2]="p.y + p.h / 2" />
      <text class="texto-pasillo" [attr.x]="p.x + p.w / 2" [attr.y]="p.y + p.h / 2 - 2.4" text-anchor="middle">PASILLO DE CARGA</text>
      <text class="texto-pasillo sub" [attr.x]="p.x + p.w / 2" [attr.y]="p.y + p.h / 2 + 5" text-anchor="middle">acceso 24/7 con código personal</text>
      <g class="entrada">
        <path [attr.d]="'M 3 ' + (p.y + 9) + ' H ' + (p.x - 3) + ' m -4 -3.5 l 4 3.5 l -4 3.5'" />
        <text x="3" [attr.y]="p.y + 4.4">Entrada</text>
      </g>
    }

    <!-- Bodegas -->
    @for (u of unidades(); track u.b.id) {
      @let chica = u.h <= (vertical() ? 35 : 25);
      @let conNombre = !!u.nombre && u.h > 25;
      <g class="unidad"
         [class]="'estado-' + u.b.estado"
         [class.propia]="u.propia"
         [class.bloqueada]="!u.elegible"
         [class.elegida]="seleccion() === u.b.id"
         [attr.role]="u.elegible ? 'button' : 'img'"
         [attr.tabindex]="u.elegible ? 0 : null"
         [attr.aria-label]="u.aria"
         [attr.aria-pressed]="u.elegible ? seleccion() === u.b.id : null"
         (click)="u.elegible && elegir.emit(u.b.id)"
         (keydown)="tecla($event, u)">
        <title>{{ u.aria }}</title>
        <rect class="piso" [attr.x]="u.x" [attr.y]="u.y" [attr.width]="u.w" [attr.height]="u.h" />
        <!-- Cortina (puerta enrollable) hacia el pasillo -->
        <line class="hueco" [attr.x1]="u.puerta.x1" [attr.y1]="u.puerta.y1" [attr.x2]="u.puerta.x2" [attr.y2]="u.puerta.y2" />
        <line class="cortina" [attr.x1]="u.cortina.x1" [attr.y1]="u.cortina.y1" [attr.x2]="u.cortina.x2" [attr.y2]="u.cortina.y2" />

        <text class="t-codigo" [attr.x]="u.x + (vertical() ? 3.6 : 2.4)" [attr.y]="u.y + (vertical() ? 5.2 : 6.4)">{{ u.b.id }}</text>
        <text class="t-area" [attr.x]="u.x + u.w / 2" [attr.y]="u.y + (chica ? (vertical() ? 13 : 12.6) : u.h / 2)" text-anchor="middle">{{ u.b.m2 }} m²</text>
        @if (!chica) {
          <text class="t-medida" [attr.x]="u.x + u.w / 2" [attr.y]="u.y + u.h / 2 + (vertical() ? 6 : 5.6)" text-anchor="middle">{{ u.b.dimensiones }}</text>
        }
        <text class="t-estado" [attr.x]="u.x + u.w / 2" [attr.y]="u.y + u.h - (conNombre ? (vertical() ? 8 : 7.2) : (vertical() ? 2.6 : 3))" text-anchor="middle">{{ u.etiqueta }}</text>
        @if (conNombre) {
          <text class="t-nombre" [attr.x]="u.x + u.w / 2" [attr.y]="u.y + u.h - (vertical() ? 2.4 : 2.6)" text-anchor="middle">{{ u.nombre }}</text>
        }
      </g>
    }

    <!-- Contorno del edificio -->
    <path class="muro" [attr.d]="contorno()" />

    <!-- Escala gráfica -->
    <g class="escala" [attr.transform]="'translate(' + escala().x + ' ' + escala().y + ')'">
      <rect x="0" y="0" width="10" height="1.6" class="lleno" />
      <rect x="10" y="0" width="10" height="1.6" class="vacio" />
      <text x="0" y="6.4">0</text>
      <text x="10" y="6.4" text-anchor="middle">1</text>
      <text x="20" y="6.4" text-anchor="middle">2 m</text>
    </g>
  </svg>
</div>
